name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        env:
          # lib/stripe.js throws on import without a key; tests never call Stripe
          STRIPE_SECRET_KEY: sk_test_dummy
        run: npm test

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  security-scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          timeout: '10m'
          exit-code: '0'

  build-push:
    needs: security-scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-ecommerce-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-ecommerce-backend:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=http://ecommerce.local/api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-ecommerce-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-ecommerce-frontend:${{ github.sha }}

  deploy:
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, minikube]
    defaults:
      run:
        shell: bash # steps use bash syntax; the default shell on a Windows runner is PowerShell
    env:
      IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/mern-ecommerce
    # the runner uses its own local kubeconfig (same machine as the cluster), so no kubeconfig secret is needed
    steps:
      - name: Deploy backend
        run: |
          kubectl set image deployment/backend-deployment \
            backend="$IMAGE_PREFIX-backend:${{ github.sha }}" -n ecommerce
          kubectl rollout status deployment/backend-deployment -n ecommerce --timeout=180s

      - name: Deploy frontend
        run: |
          kubectl set image deployment/frontend-deployment \
            frontend="$IMAGE_PREFIX-frontend:${{ github.sha }}" -n ecommerce
          kubectl rollout status deployment/frontend-deployment -n ecommerce --timeout=180s
